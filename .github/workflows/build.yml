
name: Prepare PS3 SDK

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Download PS3DEV
        uses: actions/checkout@v4
        with:
          repository: ps3dev/ps3dev
          path: ps3dev

      - name: Check SDK repository
        run: |
          ls -la ps3dev
          echo "PS3DEV source downloaded successfully"
