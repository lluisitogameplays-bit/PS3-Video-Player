
name: Build PS3 SDK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download PS3DEV
        uses: actions/checkout@v4
        with:
          repository: ps3dev/ps3dev
          path: ps3dev

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison flex gcc libelf-dev make texinfo patch wget zlib1g-dev libtool libtool-bin bzip2 pkg-config g++ libssl-dev clang python3

      - name: Build PS3DEV
        run: |
          cd ps3dev
          export PS3DEV=$GITHUB_WORKSPACE/ps3dev-install
          export PSL1GHT=$PS3DEV
          sudo mkdir -p "$PS3DEV"
          sudo chown -R "$USER" "$PS3DEV"
          ./build-all.sh

